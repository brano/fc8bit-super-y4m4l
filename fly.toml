# FC8Bit Super Y4M4L - scoreboard API.
#
# Started from the file Fly Launch generated, with the pieces it could not know
# about put back: Fly scanned the repo root, saw package.json and configured a
# Node.js app, so it had no volume, no app settings, and a contradictory vm
# block (memory = '1gb' alongside memory_mb = 256).
#
# Everything the server reads is configuration, so Fly env vars drive it:
# ASP.NET maps Scores__Secret -> "Scores:Secret", Scores__Origins__0 -> the
# first allowed origin. Secrets go in with `fly secrets set`, not here.

app = 'superyamal'
primary_region = 'ams'

[build]

[env]
  ASPNETCORE_URLS = 'http://+:8080'
  # On the volume, so scores survive a deploy.
  Scores__DbPath = '/data/scores.db'
  # Fly's proxy sets this itself and overwrites anything the caller sent, so it
  # is safe to key the rate limiter on. Without it every request arrives from
  # the proxy and the per-IP limit becomes one global 10/min bucket.
  Scores__ClientIpHeader = 'Fly-Client-IP'
  # Not secrets, so they live here rather than in `fly secrets` - config arrays
  # merge BY INDEX, and setting only Scores__Origins__0 as a secret silently
  # replaced appsettings' index 0 (localhost:5199) instead of adding to it.
  # Listing every index here keeps the whole allow-list in one visible place.
  # A Fly secret of the same name would override these, so unset any first:
  #   fly secrets unset Scores__Origins__0
  Scores__Origins__0 = 'https://brano.github.io'
  Scores__Origins__1 = 'http://localhost:5199'
  Scores__Origins__2 = 'http://127.0.0.1:5199'

# SQLite on a single machine. Do not scale past one: the volume attaches to one
# machine, and a second would quietly serve its own empty database.
[[mounts]]
  source = 'superyamal_scores_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

# Smallest shared machine. It idles stopped, so compute is only billed while a
# request is actually being served; the volume is the standing cost. Measured
# at ~50MB on boot and ~61MB under a burst, so 256MB has real headroom.
[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
